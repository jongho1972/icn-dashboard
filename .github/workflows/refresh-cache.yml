name: Refresh dashboard cache

on:
  schedule:
    # cron 예약 22:00 UTC (=07:00 KST 다음날), 06:00 UTC (=15:00 KST)
    # 큐 지연(오전 +3h, 오후 +2h) 흡수 → 실제 ~10:00 KST, ~17:00 KST 도착
    - cron: '0 22,6 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/refresh
        run: |
          curl -fsS --max-time 180 --retry 2 \
            -X POST \
            -H "X-Refresh-Token: ${{ secrets.REFRESH_TOKEN }}" \
            https://jhawk-flight-schedule.onrender.com/api/refresh
