name: Daily backfill

on:
  schedule:
    # cron 예약 14:30 KST = 05:30 UTC (큐 지연 평균 +2h 감안, 실제 ~16:30 KST 도착)
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 2026-06-02 Node 20 → 24 강제 전환 대비, JS actions 즉시 Node 24로 동작
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run backfill
        env:
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
        run: python3 backfill.py

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Daily_Data/
          if git diff --cached --quiet; then
            echo "RESULT: NO_CHANGES"
            ls Daily_Data/ | wc -l
            exit 0
          fi
          git diff --cached --stat
          git commit -m "data: daily backfill $(date -u +%Y%m%d)"
          git push origin main || (git pull --rebase origin main && git push origin main)
          echo "RESULT: PUSHED"
          ls Daily_Data/ | wc -l

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: jongho1972@gmail.com
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.mime.text import MIMEText
          from email.utils import formataddr
          user = os.environ.get("GMAIL_USER")
          pw_raw = os.environ.get("GMAIL_APP_PASSWORD")
          if not user or not pw_raw:
              print("[notify] secrets missing; skip"); raise SystemExit(0)
          body = (
              "인천공항 국제선 항공편수 daily-backfill이 실패했습니다.\n"
              "(전체 일자 수집 실패 또는 push 실패)\n\n"
              f"워크플로우 로그: {os.environ['RUN_URL']}\n"
          )
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = "[실패] 인천공항 국제선 항공편수 daily-backfill"
          msg["From"] = formataddr(("인천공항점(마케팅)", user))
          msg["To"] = os.environ["NOTIFY_TO"]
          pw = "".join(pw_raw.split())
          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
              s.login(user, pw)
              s.send_message(msg)
          print("Failure notification sent to", os.environ["NOTIFY_TO"])
          PY
