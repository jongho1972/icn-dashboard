name: Daily backfill

on:
  schedule:
    # 매일 16:30 KST = 07:30 UTC (refresh-cache 17:00 KST 직전 30분 마진)
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 2026-06-02 Node 20 → 24 강제 전환 대비, JS actions 즉시 Node 24로 동작
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run backfill
        env:
          INCHEON_API_KEY: ${{ secrets.INCHEON_API_KEY }}
        run: python3 backfill.py

      - name: Commit and push if changed (with rebase retry)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Daily_Data/
          if git diff --cached --quiet; then
            echo "RESULT: NO_CHANGES"
            ls Daily_Data/ | wc -l
            exit 0
          fi
          git diff --cached --stat
          git commit -m "data: daily backfill $(date -u +%Y%m%d)"
          # 동시 push 충돌 대비 — pull --rebase 후 push 재시도 최대 3회
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "RESULT: PUSHED (attempt $attempt)"
              ls Daily_Data/ | wc -l
              exit 0
            fi
            echo "Push failed (attempt $attempt) — pulling and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 10))
          done
          echo "RESULT: PUSH_FAILED"
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = os.environ["GMAIL_USER"]
          msg["To"] = "jongho1972@gmail.com"
          msg["Subject"] = "[ICN backfill] 실패 알림"
          msg.set_content("Daily backfill 워크플로우가 실패했습니다. GitHub Actions 로그를 확인하세요.")
          ctx = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=ctx) as s:
              s.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"].replace(" ", ""))
              s.send_message(msg)
          PY
