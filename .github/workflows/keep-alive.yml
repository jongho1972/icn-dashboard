name: Keep Render alive

on:
  schedule:
    # 14분마다 — Render 무료 플랜 슬립 한계(~15분) 직전 마진 1분
    # /healthz는 가벼운 응답이라 컨테이너 CPU 비용도 최소화
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Liveness probe via /healthz
        run: |
          curl -fsS --max-time 300 --retry 2 --retry-delay 30 \
            https://jhawk-flight-schedule.onrender.com/healthz
